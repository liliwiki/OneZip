[package]
name = "onezip-setup"
description = "OneZip-<version>-Setup.exe: the installer. The release files are appended to this exe as a zip (see packaging/build-package.ps1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "onezip-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
slint = "1.18"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
