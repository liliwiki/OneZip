[package]
name = "onezip-setup"
description = "OneZip-<version>-Setup.exe: the installer and (as uninstall.exe) the uninstaller. The release files are appended to this exe as a zip (see packaging/build-package.ps1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "onezip-setup"
path = "src/main.rs"

[dependencies]
onezip-i18n.workspace = true
anyhow.workspace = true
onezip-settings.workspace = true
slint = "1.18"
rfd = "0.15"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
onezip-i18n.workspace = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
