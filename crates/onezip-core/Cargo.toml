[package]
name = "onezip-core"
description = "OneZip engine: one entry point over HatchZip (in-place extraction) and Peel (extract while downloading)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hatchzip-core.workspace = true
peel-rs.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4.46"
zstd = "0.13"
