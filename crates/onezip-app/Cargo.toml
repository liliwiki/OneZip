[package]
name = "onezip-app"
description = "OneZip.exe: the OneZip window and the target of the right-click menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "OneZip"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
onezip-core.workspace = true
slint = { version = "1.18", features = ["raw-window-handle-06"] }
rfd = "0.15"
interprocess = "2.2"

[build-dependencies]
slint-build = "1.18"

[target."cfg(windows)".dependencies]
winreg = "0.56"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
