[package]
name = "onezip-app"
description = "OneZip.exe: the OneZip window and the target of the right-click menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "OneZip"
path = "src/main.rs"

[dependencies]
onezip-i18n.workspace = true
anyhow.workspace = true
onezip-core.workspace = true
onezip-formats.workspace = true
onezip-menu.workspace = true
onezip-settings.workspace = true
serde_json = "1"
sha2 = "0.11"
slint = { version = "1.18", features = ["raw-window-handle-06"] }
rfd = "0.15"
interprocess = "2.2"

[build-dependencies]
slint-build = "1.18"
onezip-i18n.workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56"
raw-window-handle = "0.6"
windows-future = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
