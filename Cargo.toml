[workspace]
resolver = "3"
members = ["crates/onezip-formats", "crates/onezip-menu", "crates/onezip-settings", "crates/onezip-core", "crates/onezip-cli", "crates/onezip-app", "crates/onezip-shell", "crates/onezip-setup"]
# 拷进来改过的上游代码，不当作工作区成员（不跑它们的测试、不套用本项目的 lint）。
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# hatchzip-core needs 1.93.
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
onezip-core = { path = "crates/onezip-core" }
onezip-formats = { path = "crates/onezip-formats" }
onezip-menu = { path = "crates/onezip-menu" }
onezip-settings = { path = "crates/onezip-settings" }
anyhow = "1.0.100"

# 本地"边解压边释放"：HatchZip 的引擎（MIT OR Apache-2.0）。
# 打开 `rar` 特性：RAR4/RAR5、分卷、密码、加密文件名都由它处理。它会编译 UnRAR 的
# C++ 源码（UnRAR 许可，见 third_party/hatchzip-core/LICENSE-UNRAR），需要 MSVC。
# 用的是 third_party/hatchzip-core 里改过的副本（见文件末尾的 [patch.crates-io]）。
hatchzip-core = { version = "=0.1.10", features = ["rar"] }

# 边下载边解压：Peel 的引擎（MIT OR Apache-2.0）。尚未发布到 crates.io，
# 固定到 agouin/peel 的 v0.8.0 提交。
peel-rs = { git = "https://github.com/agouin/peel", rev = "77d2e34b6138cc6279a5e0d1a64271b07faa0219" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# 解码在未优化构建里慢到拖垮测试，依赖一律优化。
[profile.dev.package."*"]
opt-level = 2
debug = false

# HatchZip 0.1.10 在 Windows 上每写完一个文件就单独刷一次盘，大量小文件时很慢。
# third_party/hatchzip-core 改成批次提交时并行刷盘，改动见其 ONEZIP-CHANGES.md。
[patch.crates-io]
hatchzip-core = { path = "third_party/hatchzip-core" }
# sevenz-rust2 用的 0.23：多线程 LZMA2 编码器加了进度与取消钩子，见 third_party/lzma-rust2/ONEZIP-CHANGES.md。
lzma-rust2 = { path = "third_party/lzma-rust2" }

# Peel：WinZip AE-2 加密的 zip 条目 CRC 按规范为 0（由 HMAC 校验），原版仍去比 CRC，
# 解这类包必定报错。third_party/peel 跳过 AE-2 的 CRC 比较，见其 ONEZIP-CHANGES.md。
[patch."https://github.com/agouin/peel"]
peel-rs = { path = "third_party/peel" }
